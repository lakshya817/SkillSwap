
name: Test SkillSwap Application

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile app.py

      - name: Test Flask routes
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()

          response = client.get("/")
          assert response.status_code == 200
          assert response.json["project"] == "SkillSwap"

          response = client.get("/health")
          assert response.status_code == 200
          assert response.json["status"] == "healthy"

          print("PASS: Home and health routes work.")
          PY

      - name: Test database health route without a database
        run: |
          python - <<'PY'
          from unittest.mock import patch
          import mysql.connector
          from app import app

          client = app.test_client()

          with patch(
              "app.get_db_connection",
              side_effect=mysql.connector.Error("Test database unavailable")
          ):
              response = client.get("/api/db-health")

          assert response.status_code == 503
          assert response.json["status"] == "unavailable"
          assert response.json["database"] == "disconnected"

          print("PASS: Database failures are handled safely.")
          PY
