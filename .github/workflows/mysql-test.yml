

name: Test SkillSwap Database

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: skillswap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Create schema
        run: |
          mysql -h 127.0.0.1 -uroot -ptest-root-password skillswap < database/schema.sql

      - name: Create view, procedure and trigger
        run: |
          mysql -h 127.0.0.1 -uroot -ptest-root-password skillswap < database/views.sql
          mysql -h 127.0.0.1 -uroot -ptest-root-password skillswap < database/procedures.sql
          mysql -h 127.0.0.1 -uroot -ptest-root-password skillswap < database/triggers.sql

      - name: Load sample data
        run: |
          mysql -h 127.0.0.1 -uroot -ptest-root-password skillswap < database/seed.sql

      - name: Test view and stored procedure
        run: |
          mysql -h 127.0.0.1 -uroot -ptest-root-password skillswap -e "
            SELECT COUNT(*) AS python_teachers
            FROM vw_teachable_skills
            WHERE skill_name = 'Python';

            CALL sp_find_teachers('Python');
          "

      - name: Test review trigger rejects outsiders
        run: |
          set -eu

          if mysql -h 127.0.0.1 -uroot -ptest-root-password skillswap -e "
            INSERT INTO reviews (session_id, reviewer_id, rating, comment)
            SELECT se.session_id, u.user_id, 5, 'Invalid outsider review'
            FROM sessions se
            CROSS JOIN users u
            WHERE u.email = 'kabir.test@example.com'
            LIMIT 1;
          "; then
            echo "ERROR: An outsider was allowed to review the session."
            exit 1
          else
            echo "PASS: The trigger rejected the outsider review."
          fi
